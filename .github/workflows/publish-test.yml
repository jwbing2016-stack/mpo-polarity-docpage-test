name: Publish platform test
on:
  push:
    branches: [platform-sync-test]
    paths: [article.md, publish-config.json, scripts/publish.py, requirements.txt, .github/workflows/publish-test.yml]
permissions:
  contents: write
concurrency:
  group: cablefam-platform-sync-test
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Validate both payload formats
        run: |
          python scripts/publish.py dev --dry-run
          python scripts/publish.py blogger --dry-run
      - name: Publish or update DEV
        env:
          DEV_API_KEY: ${{ secrets.DEV_API_KEY }}
        run: |
          if [ -n "$DEV_API_KEY" ]; then
            python scripts/publish.py dev --create
          else
            echo "DEV skipped: DEV_API_KEY has not been configured"
          fi
      - name: Publish or update Blogger
        if: always()
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          if [ -n "$BLOGGER_CLIENT_ID" ] && [ -n "$BLOGGER_CLIENT_SECRET" ] && [ -n "$BLOGGER_REFRESH_TOKEN" ]; then
            python scripts/publish.py blogger --create
          else
            echo "Blogger skipped: OAuth credentials have not been configured"
          fi
      - name: Preserve article IDs for subsequent updates
        if: always()
        run: |
          if [ -f publish-state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add publish-state.json
            if ! git diff --cached --quiet; then
              git commit -m "Save platform article IDs"
              git push origin HEAD:platform-sync-test
            fi
          fi
